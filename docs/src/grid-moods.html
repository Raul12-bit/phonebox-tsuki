<!doctype html><meta charset="utf-8"><title>moods</title>
<link rel="stylesheet" href="mockup.css">
<style>
  .wrap { padding: 26px 28px 30px; display: grid; grid-template-columns: repeat(9, 118px); gap: 14px 10px; justify-content: center; }
  figure { margin: 0; display: flex; flex-direction: column; align-items: center; }
  figure svg { width: 118px; height: 126px; border-radius: 16px; background: #000; box-shadow: 0 0 0 1px #2a2a2a; }
  figcaption { margin-top: 7px; font-size: 13px; color: #a8a8a8; letter-spacing: .02em; }
</style>
<div class="sheet"><div class="wrap" id="wrap"></div></div>
<script src="tsuki.js"></script>
<script>
  // every face of the rig, cropped to the head (26 moods) + one pose to fill the last cell
  var wrap = document.getElementById('wrap');
  function face(mood, pose, label, vb) {
    var f = document.createElement('figure');
    f.innerHTML = '<svg viewBox="' + (vb || '22 14 156 172') + '"><g></g></svg><figcaption>' + label + '</figcaption>';
    wrap.appendChild(f);
    Tsuki.create(f.querySelector('g'), { mood: mood, pose: pose || 'cross' });
  }
  Object.keys(Tsuki.MOODS).forEach(function (m) { face(m, null, m); });
  face('wink', 'peace', 'wink + peace', '10 14 180 236');
</script>
