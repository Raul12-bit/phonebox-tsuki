<style>
  body { height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2.5vh; cursor: pointer;
         -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; }
  .ico { width: 30vh; height: 30vh; transition: transform .25s cubic-bezier(.2, .8, .2, 1); }
  .ico rect, .ico path { fill: none; stroke: #fff; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .scan { stroke-opacity: .5; animation: scan 3.2s ease-in-out infinite; transform-box: fill-box; }
  .t { font-size: 8.5vh; font-weight: 500; color: #fff; }
  .s { font-size: 6vh; color: #8c8c8c; }
  body:active .ico { transform: scale(.92); }
  .mini { display: block; overflow: visible; }
  .mini .mln { fill: #0b0b0b; stroke: #fff; stroke-width: 2; stroke-linejoin: round; }
  .mini .mst { fill: none; stroke: #fff; stroke-width: 1.6; stroke-linecap: round; }
  .meyes { transform-box: fill-box; transform-origin: center; animation: mblink 5.5s infinite; }
  @keyframes mblink { 0%, 94%, 100% { transform: scaleY(1) } 96% { transform: scaleY(.08) } }
  .say { position: relative; border: 1.4px solid #fff; border-radius: 14px; background: #000; color: #fff; line-height: 1.35; }
  .say::after { content: ""; position: absolute; right: -6px; top: 50%; width: 9px; height: 9px; margin-top: -4.5px; background: #000;
                border-right: 1.4px solid #fff; border-top: 1.4px solid #fff; transform: rotate(45deg); }
  .peek { position: absolute; right: 3%; bottom: 0; display: flex; align-items: flex-end; gap: 2%; pointer-events: none; }
  .peek .mini { height: 36vh; width: auto; margin-bottom: -10vh; animation: peek 4s ease-in-out infinite; }
  .peek .say { font-size: 4.6vh; padding: 1.2vh 4vh; margin-bottom: 8vh; white-space: nowrap; }
  body { position: relative; box-sizing: border-box; padding-bottom: 22vh; }
  @keyframes peek { 0%, 100% { transform: translateY(0) } 50% { transform: translateY(-4%) } }
  @keyframes scan { 0%, 100% { transform: translateY(0); opacity: .2 } 50% { transform: translateY(7px); opacity: .8 } }
  @media (prefers-reduced-motion: reduce) { .scan { animation: none } }
</style>
