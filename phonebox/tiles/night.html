<style>
  :root { --fg: #d9d9d9; --mut: #6f6f6f; --ink: #0b0b0b; }
  html, body { background: #000; }
  body { position: relative; height: 100vh; overflow: hidden; cursor: pointer; -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none;
         font-family: Roboto, system-ui, sans-serif; }
  .jp { font-family: "Noto Sans CJK JP", "Noto Sans JP", sans-serif; }
  /* everything drifts a few pixels every minute (burn-in care). No transitions or endless keyframes anywhere on this
     page: each one made the phone's WebView draw 60 frames a second (measured: 362 frames in 6 s, 26 ms each, the
     phone at 100 % CPU while 'asleep'). The motion below is stepped by one JS timer: one frame every 1.5 s. */
  .world { position: absolute; inset: 0; }
  .sky { position: absolute; inset: 0; }
  .sky i { position: absolute; width: 3px; height: 3px; border-radius: 50%; background: #fff; opacity: .12; }
  .sky i.on { opacity: .7; }
  .tone { position: absolute; inset: 0; background: radial-gradient(circle, #ffffff14 1px, transparent 1.3px) 0 0 / 7px 7px;
          -webkit-mask-image: linear-gradient(to top, #000, transparent 45%); mask-image: linear-gradient(to top, #000, transparent 45%); }
  .moon { position: absolute; right: 7%; top: 7%; width: 22vh; height: 22vh; }
  /* clock */
  .clock { position: absolute; left: 6%; top: 50%; transform: translateY(-56%); }
  .tag { display: flex; align-items: center; gap: .7em; font-size: 3.3vh; letter-spacing: .22em; color: var(--mut); }
  .tag b { color: #bdbdbd; font-weight: 600; letter-spacing: .12em; padding: .1em .5em; border: 1px solid #ffffff40; border-radius: 4px; }
  .time { font-size: 30vh; font-weight: 100; line-height: .95; color: var(--fg); font-variant-numeric: tabular-nums; letter-spacing: -.02em; margin-top: 2vh; }
  .time .c.dim { opacity: .25; }
  .date { font-size: 4.4vh; color: #8f8f8f; margin-top: 1.5vh; } .date span { margin-left: .5em; color: #5f5f5f; }
  .hint { position: absolute; left: 6%; bottom: 6vh; font-size: 2.6vh; letter-spacing: .14em; color: #4f4f4f; }
  /* Tsuki asleep */
  .stage { position: absolute; right: 3%; bottom: 0; height: 88vh; aspect-ratio: 200 / 250; }
  svg.girl { width: 100%; height: 100%; overflow: visible; transform-origin: 50% 100%; }
  svg.girl.in { transform: scale(1.012) translateY(-.4%); }
  .ln { fill: var(--ink); stroke: #cfcfcf; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .st { fill: none; stroke: #cfcfcf; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .wh { fill: #cfcfcf; } .ink { fill: var(--ink); }
  .bub { transform-box: fill-box; transform-origin: 0% 100%; transform: scale(.6); }
  .bub.big { transform: scale(1.12); }
  .zzz { position: absolute; right: 9%; top: 20vh; font: 600 4vh Roboto, sans-serif; color: #bdbdbd; }
  .zzz span { position: absolute; opacity: 0; }
  .zzz span.on { opacity: .85; }
  .zzz span:nth-child(2) { font-size: 1.3em; transform: translate(1.5vh, -4.5vh) } .zzz span:nth-child(3) { font-size: 1.7em; transform: translate(3vh, -9vh) }
  .say { position: absolute; right: 26%; top: 18vh; max-width: 34%; padding: 1.6vh 2.2vh; border: 1.4px dashed #9a9a9a; border-radius: 18px; background: #000;
         color: #bdbdbd; font-size: 3.4vh; line-height: 1.4; opacity: 0; }
  .say.on { opacity: 1; }
  .say.awake { border-style: solid; border-color: #fff; color: #fff; }
  .sfx { position: absolute; right: 37%; top: 55vh; font: 900 7vh "Noto Sans CJK JP", "Noto Sans JP", sans-serif; color: #000; -webkit-text-stroke: 1.3px #9a9a9a;
         transform: rotate(-8deg); opacity: .8; }
</style>

<script>
  // Night screen with Tsuki asleep. Clock text changes every 10 s, she mumbles in her sleep every ~40 s, the whole
  // scene drifts a little every minute; a tap wakes her (a flustered line) and goes back to the home page.
  var RU = ['воскресенье', 'понедельник', 'вторник', 'среда', 'четверг', 'пятница', 'суббота'], WD = ['日', '月', '火', '水', '木', '金', '土'];
  var MON = ['января', 'февраля', 'марта', 'апреля', 'мая', 'июня', 'июля', 'августа', 'сентября', 'октября', 'ноября', 'декабря'];
  var TALK = ['…бака… не уходи… zzz', '…ещё пять минуточек…', '…я не… сплю… zzz', '…мур… то есть ХМФ… zzz', '…ноутбук… выключи… бака…',
              '…ты… молодец… сегодня… zzz', '…не смотри… как я сплю…', '…люблю… клубнику… zzz'];
  var WAKE = ['Ч-что?! Я не спала!', 'Кья! Предупреждать надо!', 'Я… я просто глаза закрыла!', 'Хмф. Ладно, я проснулась. Ради тебя. НЕМНОГО.'];
  var el = function (id) { return document.getElementById(id); }, say = el('say'), world = el('world'), waking = false;
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  function tick() {
    var d = new Date();
    el('hh').textContent = pad(d.getHours()); el('mm').textContent = pad(d.getMinutes());
    el('date').innerHTML = RU[d.getDay()] + ', ' + d.getDate() + ' ' + MON[d.getMonth()] + '<span class="jp">' + WD[d.getDay()] + '曜日</span>';
  }
  (function stars() {
    var sky = el('sky'), seed = 5;
    function r() { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; }
    for (var i = 0; i < 34; i++) {
      var s = document.createElement('i');
      s.style.left = (r() * 100) + '%'; s.style.top = (r() * 70) + '%';
      if (r() < .3) { s.style.width = s.style.height = '2px'; }
      sky.appendChild(s);
    }
  })();
  var last = '';
  function mumble() {
    if (waking || document.hidden) return;
    var c = TALK.filter(function (t) { return t !== last; }); last = c[Math.floor(Math.random() * c.length)];
    say.className = 'say'; say.textContent = last; void say.offsetWidth; say.classList.add('on');
    setTimeout(function () { if (!waking) say.classList.remove('on'); }, 7000);
  }
  var step = 0, SH = [[0, 0], [6, -4], [-6, 4], [4, 6], [-6, -3], [3, -6], [-3, 3]];
  function drift() { step = (step + 1) % SH.length; world.style.transform = 'translate(' + SH[step][0] + 'px,' + SH[step][1] + 'px)'; }
  // pointerdown, not click: it fires the moment the finger lands. The page switch follows almost at once, so the
  // first touch never feels ignored; a second touch while she wakes up goes home right away.
  document.addEventListener('pointerdown', function () {
    if (waking) { phonebox.goto('home'); return; }
    waking = true;
    say.className = 'say awake on'; say.textContent = WAKE[Math.floor(Math.random() * WAKE.length)];
    setTimeout(function () { phonebox.goto('home'); }, 280);
    setTimeout(function () { waking = false; say.className = 'say'; }, 1500);
  });
  // the stepped motion: stars twinkle a few at a time, the colon blinks, she breathes, the bubble grows and shrinks, z z Z
  var stars = el('sky').children, colon = document.querySelector('.time .c'), girl = document.querySelector('svg.girl'),
      bub = document.querySelector('.bub'), zs = document.querySelectorAll('.zzz span'), n = 0, calmMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  function step() {
    if (calmMotion || document.hidden || (window.pbLive && !pbLive())) return;
    n++;
    for (var i = 0; i < stars.length; i++) if (stars[i].classList.contains('on') || Math.random() < .1) stars[i].classList.toggle('on', Math.random() < .5);
    colon.classList.toggle('dim');
    if (n % 2 === 0) { girl.classList.toggle('in'); bub.classList.toggle('big'); }
    for (var z = 0; z < zs.length; z++) zs[z].classList.toggle('on', n % 4 === z);
  }
  tick(); setInterval(tick, 10000); setInterval(drift, 60000); setInterval(mumble, 40000); setTimeout(mumble, 4000); setInterval(step, 1500);
</script>
