<style>
  :root { --fg: #fff; --mut: #8c8c8c; --rule: #191919; }
  body { box-sizing: border-box; height: 100vh; padding: 4.2vh 7% 3vh; display: flex; flex-direction: column; -webkit-font-smoothing: antialiased; }
  h1 { margin: 0 0 2.2vh; font-size: 3.4vh; font-weight: 600; letter-spacing: .16em; color: var(--mut); }
  .row { flex: 1; display: flex; align-items: center; justify-content: space-between; gap: 4%; border-top: 1px solid var(--rule); min-height: 0;
         opacity: 0; animation: in .5s cubic-bezier(.2, .8, .2, 1) forwards; }
  .k { font-size: 3.7vh; color: var(--mut); white-space: nowrap; }
  .v { font-size: 4.4vh; color: var(--fg); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: right; }
  .bar { width: 100%; height: 2px; background: #1d1d1d; margin-top: .9vh; border-radius: 2px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: #fff; transform-origin: left; transform: scaleX(0); transition: transform .8s cubic-bezier(.2, .8, .2, 1); }
  .vb { display: flex; flex-direction: column; align-items: flex-end; min-width: 40%; }
  @keyframes in { from { opacity: 0; transform: translateX(6px) } to { opacity: 1; transform: none } }
  @media (prefers-reduced-motion: reduce) { .row { animation: none; opacity: 1 } .bar i { transition: none } }
</style>
<h1>НОУТБУК <span style="font-family:'Noto Sans CJK JP', 'Noto Sans JP', sans-serif;letter-spacing:0;color:#5f5f5f">ノートPC</span></h1>
<div id="list"></div>
<script>
  // Black-and-white key/value list of laptop details. Rows are built once, then only their text and bars change.
  var ROWS = [
    ['gpuT', 'Видеокарта'], ['gpuP', 'Мощность GPU'], ['vram', 'Видеопамять', true], ['disk', 'Диск', true],
    ['down', 'Загрузка'], ['up', 'Отдача'], ['ping', 'Пинг'], ['upt', 'Работает']
  ];
  var list = document.getElementById('list'), cell = {};
  list.style.cssText = 'flex:1;display:flex;flex-direction:column;min-height:0';
  ROWS.forEach(function (r, i) {
    var row = document.createElement('div'); row.className = 'row'; row.style.animationDelay = (i * 0.04) + 's';
    row.innerHTML = '<span class="k">' + r[1] + '</span><span class="vb"><span class="v">–</span>' + (r[2] ? '<span class="bar"><i></i></span>' : '') + '</span>';
    list.appendChild(row);
    cell[r[0]] = { v: row.querySelector('.v'), bar: row.querySelector('.bar i') };
  });
  function rate(b) { if (b == null) return '–'; var m = b / 1048576; return m >= 1 ? m.toFixed(1) + ' МБ/с' : Math.round(b / 1024) + ' КБ/с'; }
  function up(s) { var d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60); return d ? d + ' д ' + h + ' ч' : h ? h + ' ч ' + m + ' мин' : m + ' мин'; }
  function put(k, text, frac) { var c = cell[k]; if (c.v.textContent !== text) c.v.textContent = text; if (c.bar && frac != null) c.bar.style.transform = 'scaleX(' + Math.max(0, Math.min(1, frac)).toFixed(3) + ')'; }
  phonebox.on('state', function (s) {
    if (window.pbLive && !pbLive()) return; // off screen: keep the history, skip the drawing (perf guard, apply.py)
    var pc = s && s.pc; if (!pc) return;
    var g = pc.gpu || {}, disk = (pc.disks || [])[0];
    put('gpuT', g.temp != null ? Math.round(g.temp) + '°C' + (g.clock ? ' · ' + g.clock + ' МГц' : '') : '–');
    put('gpuP', g.power != null ? g.power.toFixed(1) + ' Вт' : '–');
    put('vram', g.vramUsed != null && g.vramTotal ? g.vramUsed.toFixed(1) + ' / ' + g.vramTotal.toFixed(0) + ' ГБ' : '–', g.vramTotal ? g.vramUsed / g.vramTotal : 0);
    put('disk', disk ? disk.name + ' ' + Math.round(disk.usedGb) + ' / ' + Math.round(disk.totalGb) + ' ГБ' : '–', disk ? disk.usedGb / disk.totalGb : 0);
    put('down', rate(pc.netDownBps)); put('up', rate(pc.netUpBps));
    put('ping', s.ping && s.ping.ms != null ? Math.round(s.ping.ms) + ' мс' + (s.ping.lossPct ? ' · потери ' + s.ping.lossPct + '%' : '') : '–');
    put('upt', pc.uptimeSec ? up(pc.uptimeSec) : '–');
  });
</script>
