<style>
  :root { --ink: #0b0b0b; --mut: #8c8c8c; }
  html, body { background: transparent; }
  body { position: relative; height: 100vh; overflow: hidden; display: flex; flex-direction: column; align-items: center;
         -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; touch-action: none;
         font-family: Roboto, system-ui, sans-serif; }
  .jp { font-family: "Noto Sans CJK JP", "Noto Sans JP", sans-serif; }
  /* manga layers */
  .tone { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(circle, #ffffff22 1.1px, transparent 1.4px) 0 0 / 7px 7px;
          -webkit-mask-image: linear-gradient(to top, #000, transparent 60%); mask-image: linear-gradient(to top, #000, transparent 60%); }
  .speed { position: absolute; inset: -10%; pointer-events: none; opacity: 0; transition: opacity .35s;
           background: repeating-conic-gradient(from 0deg at 50% 58%, #fff0 0deg 4.2deg, #ffffff2a 4.2deg 5deg);
           -webkit-mask-image: radial-gradient(circle at 50% 58%, transparent 30%, #000 72%); mask-image: radial-gradient(circle at 50% 58%, transparent 30%, #000 72%); }
  .glow { position: absolute; left: 50%; top: 58%; width: 80%; aspect-ratio: 1; transform: translate(-50%, -50%); border-radius: 50%; pointer-events: none;
          background: radial-gradient(circle, #ffffff12, transparent 65%); opacity: 0; transition: opacity .6s; }
  body.m-angry .speed { opacity: 1; }
  body.m-shy .glow, body.m-happy .glow, body.m-pat .glow { opacity: 1; }
  /* speech bubble */
  .bubble { position: relative; z-index: 3; margin: 3.6vh 5% 0; align-self: stretch; min-height: 15.5vh; box-sizing: border-box; padding: 2.4vh 4.5% 2vh;
            border: 1.6px solid #fff; border-radius: 20px; background: #000; font-size: 3.55vh; line-height: 1.42; color: #fff; transform-origin: 50% 100%; }
  .bubble::after { content: ""; position: absolute; left: 50%; bottom: -8px; width: 13px; height: 13px; margin-left: -6.5px; background: #000;
                   border-right: 1.6px solid #fff; border-bottom: 1.6px solid #fff; transform: rotate(45deg); }
  .bubble.shout { border-width: 2.6px; border-radius: 9px; }
  .bubble.soft { border-style: dashed; }
  .bubble.pop { animation: pop .42s cubic-bezier(.3, 1.6, .5, 1); }
  .who, .aff { position: absolute; top: -1.5vh; padding: 0 6px; background: #000; font-size: 2.3vh; letter-spacing: .16em; color: var(--mut); line-height: 3vh; }
  .who { left: 14px; } .aff { right: 12px; display: flex; align-items: center; gap: 4px; letter-spacing: .05em; }
  .aff svg { width: 2.5vh; height: 2.5vh; } .aff path { fill: none; stroke: #fff; stroke-width: 2.2; } .aff .f path { fill: #fff; } .aff .h path { fill: #ffffff66; }
  .aff.bump { animation: bump .5s cubic-bezier(.3, 1.6, .5, 1); }
  /* stage + character */
  .stage { position: relative; z-index: 1; flex: 1; width: 100%; min-height: 0; display: flex; align-items: flex-end; justify-content: center; }
  svg.girl { height: 100%; max-width: 100%; overflow: visible; animation: breathe 4.2s ease-in-out infinite; }
  svg.girl.hop { animation: hop .45s cubic-bezier(.3, 1.6, .5, 1); }
  svg.girl.shake { animation: shake .4s linear; }
  .ln { fill: var(--ink); stroke: #fff; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .st { fill: none; stroke: #fff; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .wh { fill: #fff; } .ink { fill: var(--ink); }
  .head { transform-origin: 100px 168px; transition: transform .5s cubic-bezier(.3, 1.4, .5, 1); }
  .m-shy .head, .m-pat .head { transform: rotate(-6deg); } .m-smug .head { transform: rotate(5deg); } .m-sleep .head { transform: rotate(-9deg) translateY(3px); }
  .tailL { transform-origin: 46px 80px; animation: swayL 3.8s ease-in-out infinite; }
  .tailR { transform-origin: 154px 80px; animation: swayR 3.8s ease-in-out infinite; }
  .ahoge { transform-origin: 104px 36px; animation: wig 2.6s ease-in-out infinite; }
  .eyes-open { transform-box: fill-box; transform-origin: center; animation: blink 5s infinite; }
  .browL, .browR { transition: transform .3s; transform-box: fill-box; }
  .browL { transform-origin: right center; } .browR { transform-origin: left center; }
  .m-angry .browL { transform: rotate(10deg) translateY(2px); } .m-angry .browR { transform: rotate(-10deg) translateY(2px); }
  .m-shy .browL, .m-pat .browL, .m-surprised .browL { transform: rotate(-10deg) translateY(-3px); }
  .m-shy .browR, .m-pat .browR, .m-surprised .browR { transform: rotate(10deg) translateY(-3px); }
  .m-surprised .iris { transform: scale(.72); transform-box: fill-box; transform-origin: center; }
  /* which parts each mood shows */
  [data-m] { opacity: 0; transition: opacity .2s; }
  .m-normal [data-m~=normal], .m-angry [data-m~=angry], .m-shy [data-m~=shy], .m-happy [data-m~=happy], .m-sleep [data-m~=sleep],
  .m-smug [data-m~=smug], .m-surprised [data-m~=surprised], .m-pat [data-m~=pat] { opacity: 1; }
  .zzz text { fill: #fff; font: 600 13px Roboto, sans-serif; animation: float 2.6s ease-in-out infinite; }
  .zzz text:nth-child(2) { animation-delay: .9s } .zzz text:nth-child(3) { animation-delay: 1.8s }
  .twk { animation: twinkle 2.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  .twk:nth-of-type(2) { animation-delay: .7s } .twk:nth-of-type(3) { animation-delay: 1.4s }
  /* effects */
  .sfx { position: absolute; z-index: 4; right: 4%; top: 25vh; font: 900 8.5vh "Noto Sans CJK JP", "Noto Sans JP", sans-serif; color: #000;
         -webkit-text-stroke: 1.6px #fff; transform: rotate(12deg); opacity: 0; pointer-events: none; }
  .sfx.left { right: auto; left: 4%; transform: rotate(-12deg); }
  .sfx.show { animation: sfx 1.8s cubic-bezier(.2, .8, .2, 1) forwards; }
  .heart { position: absolute; z-index: 4; width: 5vh; height: 5vh; pointer-events: none; animation: heartUp 1.5s ease-out forwards; }
  .heart path { fill: #fff; }
  @keyframes breathe { 0%, 100% { transform: translateY(0) } 50% { transform: translateY(-1.1%) } }
  @keyframes hop { 0% { transform: translateY(0) } 40% { transform: translateY(-5%) } 100% { transform: translateY(0) } }
  @keyframes shake { 0%, 100% { transform: translateX(0) } 20% { transform: translateX(-2%) } 40% { transform: translateX(2%) } 60% { transform: translateX(-1.5%) } 80% { transform: translateX(1.5%) } }
  @keyframes swayL { 0%, 100% { transform: rotate(0) } 50% { transform: rotate(4deg) } }
  @keyframes swayR { 0%, 100% { transform: rotate(0) } 50% { transform: rotate(-4deg) } }
  @keyframes wig { 0%, 100% { transform: rotate(0) } 50% { transform: rotate(-9deg) } }
  @keyframes blink { 0%, 93%, 100% { transform: scaleY(1) } 95.5% { transform: scaleY(.06) } }
  @keyframes float { 0% { transform: translate(0, 0); opacity: 0 } 30% { opacity: 1 } 100% { transform: translate(8px, -18px); opacity: 0 } }
  @keyframes twinkle { 0%, 100% { opacity: .15; transform: scale(.5) } 50% { opacity: 1; transform: scale(1) } }
  @keyframes pop { 0% { transform: scale(.9); opacity: .4 } 100% { transform: scale(1); opacity: 1 } }
  @keyframes bump { 0% { transform: scale(1) } 40% { transform: scale(1.3) } 100% { transform: scale(1) } }
  @keyframes sfx { 0% { opacity: 0; scale: .5 } 14% { opacity: 1; scale: 1.15 } 24% { scale: 1 } 80% { opacity: 1 } 100% { opacity: 0 } }
  @keyframes heartUp { 0% { transform: translate(0, 0) scale(.4); opacity: 0 } 15% { opacity: 1; transform: translate(0, -2vh) scale(1) } 100% { transform: translate(var(--dx), -26vh) scale(.8); opacity: 0 } }
  @media (prefers-reduced-motion: reduce) { svg.girl, .tailL, .tailR, .ahoge, .eyes-open, .zzz text, .twk, .bubble.pop, .sfx.show, .heart { animation: none !important } }
</style>
