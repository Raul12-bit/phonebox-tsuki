<style>
  :root { --mut: #8c8c8c; --line: #ffffff33; }
  * { box-sizing: border-box; }
  html, body { background: transparent; }
  body { position: relative; height: 100vh; overflow: hidden; display: flex; flex-direction: column; align-items: center; margin: 0;
         -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none; touch-action: manipulation;
         font-family: Roboto, system-ui, sans-serif; color: #fff; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  button:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  .jp { font-family: "Noto Sans CJK JP", "Noto Sans JP", "Yu Gothic", sans-serif; }
  /* manga layers: screentone at the feet, speed lines when she is angry, a soft halo when she is happy */
  .tone { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(circle, #ffffff22 1.1px, transparent 1.4px) 0 0 / 7px 7px;
          -webkit-mask-image: linear-gradient(to top, #000 0%, transparent 55%); mask-image: linear-gradient(to top, #000 0%, transparent 55%); }
  .speed { position: absolute; inset: -10%; pointer-events: none; display: none;
           background: repeating-conic-gradient(from 0deg at 50% 52%, #fff0 0deg 4.2deg, #ffffff26 4.2deg 5deg);
           -webkit-mask-image: radial-gradient(circle at 50% 52%, transparent 32%, #000 74%); mask-image: radial-gradient(circle at 50% 52%, transparent 32%, #000 74%); }
  .glow { position: absolute; left: 50%; top: 52%; width: 92%; aspect-ratio: 1; transform: translate(-50%, -50%); border-radius: 50%; pointer-events: none; display: none;
          background: radial-gradient(circle, #ffffff16, transparent 64%); }
  body.fx-speed .speed, body.fx-glow .glow { display: block; }
  /* speech bubble */
  .bubble { position: relative; z-index: 3; flex: none; margin: 3.4vh 4.5% 0; align-self: stretch; min-height: 16vh; padding: 2.6vh 4.5% 2vh;
            border: 1.6px solid #fff; border-radius: 18px; background: #000; font-size: 3.7vh; line-height: 1.4; transform-origin: 50% 100%; }
  .bubble::after { content: ""; position: absolute; left: 50%; bottom: -7px; width: 12px; height: 12px; margin-left: -6px; background: #000;
                   border-right: 1.6px solid #fff; border-bottom: 1.6px solid #fff; transform: rotate(45deg); }
  .bubble.shout { border-width: 2.6px; border-radius: 8px; }
  .bubble.soft { border-style: dashed; }
  .bubble.pop { animation: pop .38s cubic-bezier(.3, 1.6, .5, 1); }
  .who { position: absolute; top: -1.6vh; left: 12px; padding: 0 6px; background: #000; font-size: 2.4vh; letter-spacing: .16em; color: var(--mut); line-height: 3.2vh; }
  .aff { position: absolute; top: -1.9vh; right: 10px; padding: 0 6px; background: #000; display: flex; align-items: center; gap: 3px; line-height: 3.6vh; color: var(--mut);
         font-size: 2.3vh; letter-spacing: .04em; }
  .aff svg { width: 2.6vh; height: 2.6vh; } .aff path { fill: none; stroke: #fff; stroke-width: 2.2; } .aff .f path { fill: #fff; } .aff .h path { fill: #ffffff66; }
  .aff.bump { animation: bump .5s cubic-bezier(.3, 1.6, .5, 1); }
  #say { min-height: 2.8em; }
  #say b { font-weight: 600; }
  .choices { display: flex; gap: 2.4%; margin-top: 1.4vh; }
  .choices:empty { display: none; }
  .choices button { flex: 1; min-height: 6.4vh; padding: .6vh 2%; border: 1.4px solid #fff; border-radius: 99px; font-size: 3.1vh; font-weight: 600; letter-spacing: .02em; }
  .choices button:first-child { background: #fff; color: #000; }
  .choices button:active { transform: scale(.95); }
  .jk { display: flex; align-items: center; justify-content: center; gap: 4%; margin: .4vh 0 .6vh; font-size: 2.6vh; color: var(--mut); letter-spacing: .1em; }
  .jk svg { width: 8vh; height: 8vh; } .jk path, .jk circle { fill: none; stroke: #fff; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .jk .vs { font: 800 3vh Roboto, sans-serif; color: #fff; letter-spacing: 0; }
  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: .3vh 6%; font-size: 3vh; color: var(--mut); }
  .stats b { color: #fff; font-weight: 600; font-variant-numeric: tabular-nums; }
  /* stage + character */
  .stage { position: relative; z-index: 1; flex: 1; width: 100%; min-height: 0; display: flex; align-items: flex-end; justify-content: center; touch-action: none; }
  svg.girl { height: 100%; max-width: 100%; overflow: visible; }
  svg.girl.hop { animation: hop .45s cubic-bezier(.3, 1.6, .5, 1); }
  svg.girl.shake { animation: shake .4s linear; }
  svg.girl.squish { animation: squish .35s cubic-bezier(.3, 1.6, .5, 1); transform-origin: 50% 100%; }
  .boing .ahoge { animation: boing .8s cubic-bezier(.3, 1.8, .4, 1); transform-origin: 104px 36px; }
  .tug .tails { animation: tug .5s cubic-bezier(.3, 1.6, .5, 1); transform-origin: 100px 90px; }
  .fpill { position: absolute; top: 1.2vh; right: 4%; display: none; align-items: center; gap: .5em; padding: .5vh 1.2em .5vh .9em; border: 1.3px solid #fff;
           border-radius: 99px; background: #000; font-size: 2.9vh; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: .04em; }
  .fpill.on { display: flex; }
  .fpill i { width: 1.4vh; height: 1.4vh; border-radius: 50%; background: #fff; }
  .fpill.rest i { background: transparent; border: 1.3px solid #fff; }
  /* sheet (food, gifts, game, focus) */
  .sheet { position: absolute; z-index: 5; left: 3.5%; right: 3.5%; bottom: 15.5vh; padding: 2vh 3.5% 2.2vh; border: 1.5px solid #fff; border-radius: 18px;
           background: #000; display: none; }
  .sheet.on { display: block; animation: up .22s cubic-bezier(.2, .8, .2, 1); }
  .sh-head { display: flex; align-items: center; gap: .6em; margin-bottom: 1.4vh; font-size: 2.6vh; letter-spacing: .14em; color: var(--mut); }
  .sh-head .sp { flex: 1; } .sh-head button { width: 5.4vh; height: 5.4vh; border-radius: 50%; border: 1px solid var(--line); font-size: 3vh; line-height: 1; }
  .sh-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.4vh 3%; }
  .sh-grid.two { grid-template-columns: 1fr 1fr; }
  .item { display: flex; flex-direction: column; align-items: center; gap: .5vh; padding: 1vh 0 .9vh; border: 1px solid var(--line); border-radius: 14px; font-size: 2.6vh; color: #d8d8d8; }
  .item svg { width: 9.5vh; height: 9.5vh; overflow: visible; }
  .item:active { background: #fff; color: #000; transform: scale(.95); }
  .item:active svg .tk, .item:active .tk { --tk-line: #000; --tk-ink: #fff; }
  .item.big { padding: 1.6vh 0; font-size: 3vh; font-weight: 600; }
  .item small { font-size: .85em; color: var(--mut); font-weight: 400; }
  .item .hand path, .item .hand circle { fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  /* dock */
  .dock { position: relative; z-index: 4; align-self: stretch; display: flex; justify-content: space-between; gap: 1.5%; padding: 0 3.5% 2.2vh; }
  .dock button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: .5vh; font-size: 2.55vh; letter-spacing: .02em; color: #bdbdbd; }
  .dock .ic { width: 8.6vh; height: 8.6vh; border-radius: 50%; border: 1.3px solid var(--line); background: #050505; display: grid; place-items: center; }
  .dock .ic svg { width: 52%; height: 52%; fill: none; stroke: #fff; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .dock button:active .ic, .dock button.on .ic { background: #fff; border-color: #fff; }
  .dock button:active .ic svg, .dock button.on .ic svg { stroke: #000; }
  .dock button.on { color: #fff; }
  /* effects */
  .sfx { position: absolute; z-index: 4; right: 4%; top: 27vh; font: 900 8.5vh "Noto Sans CJK JP", "Noto Sans JP", "Yu Gothic", sans-serif; color: #000;
         -webkit-text-stroke: 1.6px #fff; transform: rotate(12deg); opacity: 0; pointer-events: none; white-space: nowrap; }
  .sfx.left { right: auto; left: 4%; transform: rotate(-12deg); }
  .sfx.show { animation: sfx 1.6s cubic-bezier(.2, .8, .2, 1) forwards; }
  .heart { position: absolute; z-index: 4; width: 5vh; height: 5vh; pointer-events: none; animation: heartUp 1.5s ease-out forwards; }
  .heart path { fill: #fff; }
  @keyframes hop { 0% { transform: translateY(0) } 40% { transform: translateY(-5%) } 100% { transform: translateY(0) } }
  @keyframes shake { 0%, 100% { transform: translateX(0) } 20% { transform: translateX(-2%) } 40% { transform: translateX(2%) } 60% { transform: translateX(-1.5%) } 80% { transform: translateX(1.5%) } }
  @keyframes squish { 0% { transform: scale(1, 1) } 35% { transform: scale(1.04, .95) } 100% { transform: scale(1, 1) } }
  @keyframes boing { 0% { transform: rotate(0) } 20% { transform: rotate(-28deg) } 45% { transform: rotate(18deg) } 70% { transform: rotate(-8deg) } 100% { transform: rotate(0) } }
  @keyframes tug { 0% { transform: translateY(0) } 35% { transform: translateY(5px) } 100% { transform: translateY(0) } }
  @keyframes pop { 0% { transform: scale(.92); opacity: .4 } 100% { transform: scale(1); opacity: 1 } }
  @keyframes bump { 0% { transform: scale(1) } 40% { transform: scale(1.3) } 100% { transform: scale(1) } }
  @keyframes up { from { transform: translateY(14px); opacity: 0 } to { transform: none; opacity: 1 } }
  @keyframes sfx { 0% { opacity: 0; scale: .5 } 14% { opacity: 1; scale: 1.15 } 24% { scale: 1 } 80% { opacity: 1 } 100% { opacity: 0 } }
  @keyframes heartUp { 0% { transform: translate(0, 0) scale(.4); opacity: 0 } 15% { opacity: 1; transform: translate(0, -2vh) scale(1) } 100% { transform: translate(var(--dx), -26vh) scale(.8); opacity: 0 } }
  @media (prefers-reduced-motion: reduce) { svg.girl, .bubble.pop, .sfx.show, .heart, .sheet.on, .boing .ahoge, .tug .tails, .aff.bump { animation: none !important } }

<script>
  // ツキ (Tsuki), the tsundere on «Главная». She remembers (affection 0-100, stats, focus timer) through the screen
  // server's /mem, reacts to where you touch her, follows your finger with her eyes, eats, takes gifts, plays
  // rock-paper-scissors, asks questions, runs a focus timer, and comments on the laptop, the weather and the time.
  // Motion budget (Redmi A5): blinks and glances are single attribute swaps on a timer; CSS animations only run for
  // a moment after a touch; everything stops while the tile is off screen (pbLive from the perf guard).
  var $ = function (id) { return document.getElementById(id); };
  var rig = Tsuki.create($('tk'), { pose: 'cross' });
  var girl = $('girl'), say = $('say'), bubble = $('bubble'), choicesEl = $('choices'), sfxEl = $('sfx'), affEl = $('aff');
  var stage = $('stage'), sheet = $('sheet'), shGrid = $('shGrid'), dock = $('dock');
  var S = null, Q = null, W = null, WORK = null;
  function pbNow() { return new Date(Date.now() + ((window.PB_PREVIEW || {}).offsetMs || 0)); }
  function live() { return window.pbLive ? pbLive() : !document.hidden; }
  function r(a) { return a[Math.floor(Math.random() * a.length)]; }
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  var lastLine = '';
  function pick(a) { var c = a.filter(function (x) { return (x[1] || x) !== lastLine; }); return r(c.length ? c : a); }
  function dayKey(d) { d = d || pbNow(); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); }

  // ---------------------------------------------------------------- memory (screen server /mem, see ScreenServer.cs)
  var MEM_BASE = '__BASE__', MEM_KEY = '__KEY__', memReady = false, saveT = null, dirty = false;
  var mem = { v: 1, aff: 30, pats: 0, pokes: 0, fed: 0, gifts: 0, tickles: 0, jk: [0, 0, 0], first: Date.now(), seen: Date.now(),
              day: '', streak: 0, days: 0, focus: { until: 0, len: 0, rest: 0, done: 0, day: '' }, t: 0 };
  var online = !!(MEM_BASE && MEM_KEY && MEM_BASE.indexOf('http') === 0);
  function memUrl(q) { return MEM_BASE + '/mem?k=' + encodeURIComponent(MEM_KEY) + (q || '') + '&_=' + Date.now(); }
  function memLoad(done) {
    var fallback = function () { if (window.PB_PREVIEW && PB_PREVIEW.mem) Object.assign(mem, PB_PREVIEW.mem); memReady = true; done(); };
    if (!online) return fallback();
    var ctl = window.AbortController ? new AbortController() : null, to = setTimeout(function () { if (ctl) ctl.abort(); }, 6000);
    fetch(memUrl(), { cache: 'no-store', signal: ctl ? ctl.signal : undefined }).then(function (x) { return x.json(); }).then(function (o) {
      clearTimeout(to);
      if (o && o.v === 1) {
        // anything that happened before the memory arrived is added on top
        var local = mem; mem = Object.assign({}, mem, o);
        ['pats', 'pokes', 'fed', 'gifts', 'tickles'].forEach(function (k) { mem[k] = (o[k] || 0) + (local[k] - 0 > 0 && dirty ? local[k] : 0); });
        mem.focus = Object.assign({ until: 0, len: 0, rest: 0, done: 0, day: '' }, o.focus || {});
        if (!Array.isArray(mem.jk)) mem.jk = [0, 0, 0];
      }
      memReady = true; done();
    }).catch(function () { clearTimeout(to); memReady = true; done(); });
  }
  function memSave(now) {
    dirty = true; mem.t = Date.now();
    clearTimeout(saveT);
    saveT = setTimeout(function () {
      if (!online) return;
      fetch(memUrl('&set=' + encodeURIComponent(JSON.stringify(mem))), { cache: 'no-store', mode: 'no-cors' }).catch(function () {});
    }, now ? 50 : 2500);
  }

  // ---------------------------------------------------------------- affection
  function tier() { return mem.aff >= 75 ? 'dere' : mem.aff >= 50 ? 'warm' : mem.aff >= 25 ? 'cool' : 'tsun'; }
  var gains = [];  // recent gains, so ten pats in a row are not worth ten times one
  function addAff(v, why) {
    if (v > 0) {
      var now = Date.now(); gains = gains.filter(function (g) { return now - g < 120000; });
      var damp = gains.length >= 8 ? 0 : gains.length >= 5 ? .5 : 1; gains.push(now);
      v = Math.round(v * damp * 10) / 10;
    }
    var before = Math.floor(mem.aff / 10);
    mem.aff = clamp(Math.round((mem.aff + v) * 10) / 10, 0, 100);
    renderAff(Math.floor(mem.aff / 10) !== before); memSave();
  }
  function renderAff(bump) {
    var html = '<span class="jp">好感度</span>';
    for (var i = 0; i < 5; i++) {
      var v = mem.aff - i * 20, cls = v >= 17 ? 'f' : v >= 7 ? 'h' : '';
      html += '<svg viewBox="0 0 24 24" class="' + cls + '"><path d="M12 20s-7-4.4-9.3-8.6C1 8.4 2.6 5 6 5c2 0 3.3 1.1 4 2.3.4.7 1.6.7 2 0C12.7 6.1 14 5 16 5c3.4 0 5 3.4 3.3 6.4C17 15.6 12 20 12 20z"/></svg>';
    }
    affEl.innerHTML = html;
    if (bump) { affEl.classList.remove('bump'); void affEl.offsetWidth; affEl.classList.add('bump'); }
  }

  // ---------------------------------------------------------------- speaking
  var typing = null, restT = null, lastTouch = 0, lastTalk = 0, busyUntil = 0, sulkUntil = 0;
  var SFX = { angry: ['ムッ!', 'もう!', 'バカ!'], rage: ['ガーン', 'ムカッ!'], shy: ['ドキッ', 'きゅん'], pat: ['なでなで', 'ふにゃ~'],
              happy: ['えへへ', 'キラッ'], love: ['ドキドキ', 'きゅん♡'], smug: ['フン', 'ふふん'], surprised: ['えっ!?', 'ひゃっ'],
              flustered: ['あわわ', 'はわわ'], laugh: ['あはは!', 'くすくす'], sad: ['しゅん'], cry: ['うぅ…'], pout: ['ぷくー', 'むぅ'],
              eat: ['もぐもぐ'], determined: ['よし!', 'ファイト!'], shock: ['ガーン!'], tsun: ['ツーン', 'フンッ'], wink: ['てへ'],
              think: ['うーん'], sleepy: ['ふぁ~'], yawn: ['ふぁ~'] };
  function baseMood() { var h = pbNow().getHours(); return h >= 23 || h < 6 ? 'sleepy' : tier() === 'dere' ? 'happy' : 'normal'; }
  function sfx(text) {
    if (!text) return;
    sfxEl.classList.remove('show'); sfxEl.textContent = text; sfxEl.className = 'sfx' + (Math.random() < .5 ? ' left' : '');
    void sfxEl.offsetWidth; sfxEl.classList.add('show');
  }
  // speak(mood, text, {pose, props, sfx:false|'text', choices:[[label, fn]], hold: ms, html, quiet})
  // quiet: a line she says on her own (nobody touched her). It changes the picture in one repaint: no typing, no
  // pop, no shake, no katakana. On the phone the animated version cost ~60 frames per line (measured with gfxinfo).
  function speak(mood, text, o) {
    o = o || {}; lastLine = text; lastTalk = Date.now();
    rig.mood(mood);
    rig.pose(o.pose || (/^(shy|flustered)$/.test(mood) && Math.random() < .5 ? 'shy' : mood === 'love' && Math.random() < .4 ? 'heart' : 'cross'));
    rig.props(o.props || []);
    document.body.className = /^(angry|rage|shock)$/.test(mood) ? 'fx-speed' : /^(shy|happy|pat|love|laugh)$/.test(mood) ? 'fx-glow' : '';
    girl.classList.remove('shake', 'hop');
    if (!o.quiet) { void girl.getBoundingClientRect(); if (/^(angry|rage)$/.test(mood)) girl.classList.add('shake'); }
    if (o.sfx !== false && !o.quiet) sfx(typeof o.sfx === 'string' ? o.sfx : r(SFX[mood] || ['']));
    bubble.className = 'bubble' + (/^(angry|rage|shock)$/.test(mood) ? ' shout' : /^(pat|shy|love|sleepy|sad)$/.test(mood) ? ' soft' : '');
    if (!o.quiet) { void bubble.offsetWidth; bubble.classList.add('pop'); }
    choicesEl.innerHTML = '';
    clearInterval(typing);
    if (o.html || o.quiet) { if (o.html) say.innerHTML = o.html; else say.textContent = text; } else {
      var i = 0; say.textContent = '';
      typing = setInterval(function () { i += 3; say.textContent = text.slice(0, i); if (i >= text.length) { clearInterval(typing); } }, 45);
    }
    (o.choices || []).forEach(function (c) {
      var b = document.createElement('button'); b.textContent = c[0];
      b.addEventListener('click', function (e) { e.stopPropagation(); choicesEl.innerHTML = ''; lastTouch = Date.now(); c[1](); });
      choicesEl.appendChild(b);
    });
    clearTimeout(restT);
    if (!(o.choices && o.choices.length)) restT = setTimeout(rest, o.hold || 7000);
  }
  function rest() {  // back to her resting face and crossed arms; the bubble keeps its text
    rig.mood(baseMood()); rig.pose('cross'); rig.props([]); document.body.className = ''; restLook();
  }
  function restLook() { var m = Tsuki.MOODS[rig.moodName] || {}; rig.look(m.look ? m.look[0] : 0, m.look ? m.look[1] : 0); }

  // ---------------------------------------------------------------- lines
  var TSUN = ['Хмф! Я тут не ради тебя. Просто делать нечего.', 'Н-не смотри на меня так! Лучше работай.', 'Б-бака! Я слежу за ноутбуком, а не за тобой!',
    'Ладно, так и быть, помогу. Но только сегодня!', 'Если что-то сломаешь — я не виновата, понял?', 'Ты опять тут? …Ну и ладно. Не то чтобы я скучала.',
    'Чего уставился? Пульт справа, бака.', 'Это не я тебя ждала. Это ты пришёл. Запомни.', 'Хмф. Я самый полезный виджет здесь, если что.'];

    { k: 'bunny', label: 'Зайка', gain: 5, lines: [['love', 'Кролик!.. Я назову его… Бака-кун. В твою честь.'], ['shy', 'Плюшевый… Я буду с ним спать. НЕ ПРЕДСТАВЛЯЙ ЭТО.']] },
    { k: 'manga', label: 'Манга', gain: 3, lines: [['determined', 'Новый том! Только не спойлери! Я тебя знаю!'], ['happy', 'Манга! Ты понимаешь толк в подарках… иногда.']] },
    { k: 'letter', label: 'Письмо', gain: 6, lines: [['flustered', 'П-п-письмо?! Это… это любовное?! Я… я прочитаю потом!!'], ['flustered', 'С сердечком?! Т-ты… бака… бака бака бака!']] },
    { k: 'rock', label: 'Камень', gain: 1, lines: [['think', '…Камень. Ты подарил мне камень.'], ['bored', 'Камень. Обычный камень. …Он красивый. Оставлю. НЕ СМЕЙСЯ.']] }
  ];
  var giftAt = [];
  function gift(g) {
    var now = Date.now(); giftAt = giftAt.filter(function (t) { return now - t < 1800000; });
    if (giftAt.length >= 3) return speak('smug', 'Ты меня задариваешь… Подозрительно. Что ты натворил?', { pose: 'hips' });
    giftAt.push(now); mem.gifts++;
    rig.mood('surprised'); rig.pose('offer'); rig.props([{ k: g.k, x: 100, y: 212 }]); sfx('えっ!?');
    busyUntil = now + 1400;
    setTimeout(function () {
      var L = r(g.lines); addAff(g.gain);
      speak(L[0], L[1], { pose: 'offer', props: [{ k: g.k, x: 100, y: 212 }], hold: 6000 });
      if (g.k === 'rock') setTimeout(function () { speak('shy', '…Он правда красивый. Положу на полку.', { pose: 'offer', props: [{ k: 'rock', x: 100, y: 212 }] }); }, 3600);
    }, 900);
  }
  // rock-paper-scissors
  var HANDS = {
    rock: '<path d="M7 11V8.5a1.5 1.5 0 0 1 3 0v2M10 10.5V7.5a1.5 1.5 0 0 1 3 0v3M13 10.5V8a1.5 1.5 0 0 1 3 0v4c0 4.5-2.5 7-6 7S5 17 5 14v-2a1.5 1.5 0 0 1 3 0"/>',
    scissors: '<path d="M8 12L5.5 4.5a1.5 1.5 0 0 1 2.8-1L11 10M11 10l1.2-6.8a1.5 1.5 0 0 1 3 .4L14 11M14 11.5a1.5 1.5 0 0 1 3 0V13c0 4-2.5 6-6 6s-5-2.2-5-5.5V12a1.5 1.5 0 0 1 3 0"/>',
    paper: '<path d="M7 12V6a1.5 1.5 0 0 1 3 0v5M10 11V4.5a1.5 1.5 0 0 1 3 0V11M13 11V5.5a1.5 1.5 0 0 1 3 0V12M16 12V9a1.5 1.5 0 0 1 3 0v4c0 4-3 7-7 7-3 0-5-1.5-6.5-4L3 13.5a1.5 1.5 0 0 1 2.6-1.5L7 14"/>'
  };
  var JK_NAME = { rock: 'Камень', scissors: 'Ножницы', paper: 'Бумага' }, BEATS = { rock: 'scissors', scissors: 'paper', paper: 'rock' };
  function handSvg(k) { return '<svg class="hand" viewBox="0 0 24 24">' + HANDS[k] + '</svg>'; }
  var jkLoss = 0;
  function janken(you) {
    busyUntil = Date.now() + 1500;
    rig.mood('determined'); rig.pose('fists'); say.textContent = 'Камень…'; choicesEl.innerHTML = ''; sfx('じゃん');
    setTimeout(function () { rig.pose('fists2'); say.textContent = 'Камень… ножницы…'; sfx('けん'); }, 420);
    setTimeout(function () {
      var her = r(['rock', 'scissors', 'paper']), res = her === you ? 1 : BEATS[you] === her ? 0 : 2;  // 0 you win, 1 draw, 2 she wins
      mem.jk[res === 0 ? 0 : res === 2 ? 1 : 2]++; memSave();
      var card = '<div class="jk"><span>ТЫ</span>' + handSvg(you) + '<span class="vs">VS</span>' + handSvg(her) + '<span class="jp">ツキ</span></div>';
      var again = [['Ещё раз', function () { openJanken(); }], ['Хватит', function () { speak('smug', 'Счёт ' + mem.jk[0] + ':' + mem.jk[1] + '. Я запомню.'); }]];
      if (res === 2) { jkLoss = 0; addAff(1); speak('smug', '', { html: card + pick(['Хе-хе. Я непобедима! Склонись!', 'Изи. Тренируйся, бака.', JK_NAME[her] + ' бьёт. Это наука.']), sfx: 'ポン!', choices: again }); }
      else if (res === 0) { jkLoss++; speak(jkLoss >= 2 ? 'cry' : 'pout', '', { html: card + (jkLoss >= 2 ? 'Опять?! Ты подглядываешь! Нечестно!!' : pick(['Нечестно! Ещё раз!', 'Я… поддалась. Специально!', 'Хмф! Это была разминка.'])), sfx: 'ポン!', choices: again }); }
      else speak('surprised', '', { html: card + pick(['Ничья?! Ты читаешь мои мысли?!', 'Одинаково… Мы думаем одинаково?! К-кошмар!']), sfx: 'ポン!', choices: again });
    }, 900);
  }
  function openJanken() {
    openSheet('play', 'じゃんけん · ИГРА' + (mem.jk[0] + mem.jk[1] ? ' · ' + mem.jk[0] + ':' + mem.jk[1] : ''), ['rock', 'scissors', 'paper'].map(function (k) {
      return { icon: handSvg(k), label: JK_NAME[k], fn: function () { janken(k); } };
    }));
    if (Date.now() - lastTalk > 3000) speak('determined', 'Сыграем? Проигравший… просто проигравший. Выбирай!', { sfx: 'よし!' });
  }
  // talking: questions with answers, or a fact
  var ASK = [
    ['think', 'Ты сегодня поел нормально?', [['Да', 'smug', 'Хорошо. …Я не волновалась!', 1], ['Нет', 'angry', 'Бака! Иди поешь. Немедленно! Я подожду.', 0]]],
    ['shy', 'Я… тебе нравлюсь?', [['Да ♡', 'flustered', 'Ч-ЧТО?! Не говори такое так просто!! …Бака.', 3], ['Нет', 'sad', 'Х-хмф! Мне всё равно! …Совсем всё равно.', -2]]],
    ['think', 'Чай или кофе?', [['Чай', 'happy', 'Правильный ответ. Ты не безнадёжен.', 1], ['Кофе', 'smug', 'Кофе после шести — и не уснёшь, бака.', 0]]],
    ['think', 'Сколько ты спал сегодня?', [['Меньше 6 ч', 'angry', 'Меньше шести?! Сегодня ложишься раньше. Это приказ!', 0], ['7+ часов', 'happy', 'Молодец. …Я не хвалю, просто констатирую.', 1]]],
    ['sad', 'Ты меня не забудешь, если купишь новый телефон?', [['Никогда', 'love', '…Обещаешь? Ладно. Верю. Немного.', 3], ['Посмотрим', 'cry', 'Ч-что?! Бака бака бака!', -2]]],
    ['think', 'Кошки или собаки?', [['Кошки', 'happy', 'Как Моти! Хороший выбор.', 1], ['Собаки', 'think', 'Хм… собаки тоже милые. Но кошки лучше.', 0]]],
    ['normal', 'Что делаешь вечером?', [['Работаю', 'tsun', 'Опять? Не перетруждайся… это просто совет.', 0], ['Отдыхаю', 'happy', 'Отдыхай. Ты заслужил. Чуть-чуть.', 1]]],
    ['shy', 'Тебе нравится мой бантик?', [['Очень', 'shy', 'П-правда?.. Я его… для тебя… НЕТ, ДЛЯ СЕБЯ!', 2], ['Какой бантик?', 'rage', 'Я ЕГО ЧАС ЗАВЯЗЫВАЛА!!', -1]]],
    ['smug', 'Ты сейчас программируешь?', [['Да', 'determined', 'Пиши аккуратно. Я потом проверю! …Шучу. Наверное.', 1], ['Нет', 'smug', 'Тогда почему ноутбук греется? Подозрительно.', 0]]],
    ['shy', 'Погладишь меня?.. В смысле, не надо! Просто спросила!', [['Погладить', 'pat', '', 0], ['Не буду', 'pout', 'Н-ну и не надо!! Не очень-то и хотелось!', -1]]],
    ['think', 'Ты пил воду сегодня?', [['Пил', 'smug', 'Хорошо. Продолжай в том же духе.', 1], ['Забыл', 'angry', 'Забыл?! Иди налей стакан. Сейчас же!', 0]]],
    ['normal', 'Как прошёл день?', [['Отлично', 'happy', 'Правда? …Я рада. За ноутбук. Он тоже рад.', 1], ['Так себе', 'sad', 'Эй… завтра будет лучше. Я прослежу. Лично.', 2]]]
  ];
  var FACTS = [
    ['smug', 'Знаешь, что у осьминога три сердца? …И всё равно меньше, чем у меня терпения к тебе.'],
    ['think', 'Факт: каждые 20 минут посмотри вдаль 20 секунд. Глаза скажут спасибо. Я — нет.'],
    ['normal', 'Сядь ровно. Спина тебе спасибо скажет. А я просто заметила, что ты горбишься.'],
    ['smug', 'Луна по-японски — 月, «цуки». Да, меня назвали в честь Луны. Красиво, правда? Можешь не отвечать.'],
    ['think', 'Если код не работает — попробуй объяснить его резиновой уточке. Или мне. Я лучше уточки.'],
    ['happy', 'Мёд не портится тысячи лет. Как моя… к тебе… ЗАБУДЬ.'],
    ['normal', 'Котики спят по 16 часов в день. Это не лень. Это мудрость.']
  ];
  var lastAsk = -1;
  function talk() {
    if (Math.random() < .3) { var f = pick(FACTS); return speak(f[0], f[1], { hold: 9000 }); }
    var i; do { i = Math.floor(Math.random() * ASK.length); } while (i === lastAsk && ASK.length > 1); lastAsk = i;
    var q = ASK[i];
    speak(q[0], q[1], { choices: q[2].map(function (a) {
      return [a[0], function () { if (a[1] === 'pat') return pat(); addAff(a[3]); speak(a[1], a[2]); }];
    }) });
  }
  // focus timer (pomodoro). The state lives in memory, so the idle screen shows the countdown too.
  function focusLeft() { return Math.max(0, (mem.focus.until || 0) - Date.now()); }
  function fmt(ms) { var s = Math.ceil(ms / 1000), m = Math.floor(s / 60); return (m < 10 ? '0' : '') + m + ':' + (s % 60 < 10 ? '0' : '') + s % 60; }
  function startFocus(min, rest) {
    mem.focus.until = Date.now() + min * 60000; mem.focus.len = min; mem.focus.rest = rest ? 1 : 0;
    if (mem.focus.day !== dayKey()) { mem.focus.day = dayKey(); mem.focus.done = 0; }
    memSave(true); renderFocus();
    if (rest) speak('happy', 'Перерыв ' + min + ' минут. Встань, потянись, попей воды. Я засекла!', { pose: 'up', sfx: 'のび~' });
    else speak('determined', 'Фокус! ' + min + ' минут. Я слежу. Не отвлекайся, бака!', { pose: 'fists', sfx: 'ファイト!' });
  }
  function stopFocus() { var was = mem.focus.rest; mem.focus.until = 0; memSave(true); renderFocus(); speak(was ? 'normal' : 'sad', was ? 'Перерыв окончен? Ну… за работу.' : 'Сдался?.. Ладно. В следующий раз — до конца.'); }
  var focusWas = 0;
  function renderFocus() {
    var left = focusLeft(), pill = $('fpill');
    pill.classList.toggle('on', left > 0); pill.classList.toggle('rest', !!mem.focus.rest);
    if (left > 0) $('ftime').textContent = (mem.focus.rest ? 'отдых ' : '集中 ') + fmt(left);
    if (focusWas > 0 && left === 0) {  // it just ended
      if (!mem.focus.rest) { mem.focus.done++; addAff(3); memSave(true);
        speak('happy', 'Время! ' + mem.focus.done + '-й помидор за сегодня. Ты… молодец. Немного. Перерыв?', { pose: 'peace', sfx: 'やった!', choices: [['5 мин отдыха', function () { startFocus(5, true); }], ['Потом', function () { speak('smug', 'Как хочешь. Но глаза надо беречь!'); }]] });
      } else speak('determined', 'Перерыв всё! Снова за работу?', { pose: 'fists', choices: [['25 мин', function () { startFocus(25); }], ['Позже', function () { speak('normal', 'Ладно. Я тут, если что.'); }]] });
    }
    focusWas = left;
  }
  function openFocus() {
    var left = focusLeft();
    if (left > 0) return openSheet('focus', (mem.focus.rest ? 'ОТДЫХ' : 'ФОКУС · 集中') + ' — осталось ' + fmt(left), [
      { label: 'Стоп', big: true, fn: stopFocus }, { label: '+5 минут', big: true, fn: function () { mem.focus.until += 300000; memSave(true); renderFocus(); speak('smug', 'Ещё пять минут. Я добрая сегодня.'); } }], true);
    openSheet('focus', 'ФОКУС · 集中' + (mem.focus.day === dayKey() && mem.focus.done ? ' — сегодня ' + mem.focus.done : ''), [
      { label: '25', sub: 'мин', big: true, fn: function () { startFocus(25); } }, { label: '50', sub: 'мин', big: true, fn: function () { startFocus(50); } },
      { label: '5', sub: 'отдых', big: true, fn: function () { startFocus(5, true); } }]);
  }
  dock.addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    lastTouch = Date.now();
    var act = b.dataset.act;
    if (shOpen === act) return closeSheet();
    if (act === 'feed') { openSheet('feed', 'УГОСТИТЬ · おやつ', FOOD.map(function (f) { return { icon: Tsuki.icon(f.k), label: f.label, fn: function () { feed(f); } }; }));
      if (Date.now() - lastTalk > 3000) speak('think', pick(['Еда? …Ну, покажи, что у тебя.', 'Я не голодная! …Что там есть?'])); }
    if (act === 'gift') openSheet('gift', 'ПОДАРИТЬ · プレゼント', GIFTS.map(function (g) { return { icon: Tsuki.icon(g.k), label: g.label, fn: function () { gift(g); } }; }));
    if (act === 'play') openJanken();
    if (act === 'talk') { closeSheet(); talk(); }
    if (act === 'focus') openFocus();
  });
  // stats: tap the hearts
  affEl.addEventListener('click', function (e) {
    e.stopPropagation(); lastTouch = Date.now();
    var days = Math.max(1, Math.round((Date.now() - (mem.first || Date.now())) / 86400000));
    var html = '<div class="stats"><span>Вместе <b>' + days + ' ' + plural(days, 'день', 'дня', 'дней') + '</b></span><span>Привязанность <b>' + Math.round(mem.aff) + '%</b></span>' +
      '<span>Погладил <b>' + mem.pats + '</b></span><span>Угостил <b>' + mem.fed + '</b></span><span>Подарков <b>' + mem.gifts + '</b></span>' +
      '<span>じゃんけん <b>' + mem.jk[0] + ':' + mem.jk[1] + '</b></span><span>Подряд <b>' + (mem.streak || 1) + ' дн.</b></span>' +
      '<span>Фокус сегодня <b>' + (mem.focus.day === dayKey() ? mem.focus.done : 0) + '</b></span></div>';
    speak('shy', '', { html: html, sfx: 'ドキッ', hold: 9000 });
    if (!online) setTimeout(function () { if (say.querySelector('.stats')) say.insertAdjacentHTML('beforeend', '<div style="margin-top:.6vh;font-size:2.4vh;color:#8c8c8c">нет связи с сервером: помню до перезапуска</div>'); }, 50);
  });

  // ---------------------------------------------------------------- living: blinks, glances, small habits
  function sched(fn, a, b) { setTimeout(function loop() { fn(); setTimeout(loop, a + Math.random() * (b - a)); }, a + Math.random() * (b - a)); }
  sched(function () { if (live() && !down) rig.blink(); }, 2600, 6200);
  var MICRO = [
    function () { rig.look(r([-4, 4]), r([-1, 1])); setTimeout(restLook, 1500); },                 // glance aside
    function () { rig.tilt(r([-5, 5])); setTimeout(function () { var m = Tsuki.MOODS[rig.moodName] || {}; rig.tilt(m.tilt || 0); }, 2200); },
    function () { girl.classList.add('boing'); setTimeout(function () { girl.classList.remove('boing'); }, 850); },
    function () { rig.look(0, 4); setTimeout(restLook, 1800); }                                     // looks down at "the laptop"
  ];
  sched(function () {
    if (!live() || down || shOpen || Date.now() < busyUntil || choicesEl.children.length) return;
    var idle = Date.now() - lastTouch;
    if (idle > 180000 && Math.random() < .6) return;  // nobody here: fidget less
    var media = S && S.media;
    if (media && media.playing && Math.random() < .4) {  // humming along, two stepped frames
      var fx = rig.faceNow.fx; rig.face({ fx: 'notes' }); setTimeout(function () { rig.face({ fx: 'notes2' }); }, 700);
      setTimeout(function () { rig.face({ fx: (Tsuki.MOODS[rig.moodName] || {}).fx || '' }); }, 1500); return;
    }
    var h = pbNow().getHours();
    if ((h >= 23 || h < 6) && Math.random() < .35) { rig.mood('yawn'); if (idle < 60000) sfx('ふぁ~'); setTimeout(function () { rig.mood(baseMood()); }, 1600); return; }
    // the ahoge boing is a real CSS animation (~40 frames): only while someone is around; the rest are single steps
    (idle < 60000 ? r(MICRO) : r([MICRO[0], MICRO[1], MICRO[3]]))();
  }, 7000, 14000);
  function tick() {
    if (!memReady || !live()) return;
    if (Date.now() - lastTouch < 9000 || Date.now() < busyUntil || shOpen || choicesEl.children.length) return;
    if (focusLeft() > 0 && !mem.focus.rest && Math.random() < .7) return speak(r(['focus', 'determined', 'smug']), pick(['Работай. Я тоже… работаю.', 'Не смотри на меня, смотри в код!',
      'Ещё ' + fmt(focusLeft()) + '. Ты справишься. Не то чтобы я верила в тебя… ладно, верю.', 'Тс-с. Фокус. Даже я молчу.']), { quiet: true });
    var p = pick(context());
    // right after a touch she is "performing" for you; when nobody touched her for a while she just talks
    speak(p[0], p[1], { quiet: Date.now() - lastTouch > 60000 });
  }

  // ---------------------------------------------------------------- start, visibility, data
  var hiddenAt = 0, wasVisible = true;
  try {
    new IntersectionObserver(function (e) {
      var v = e[e.length - 1].isIntersecting;
      if (!v && wasVisible) hiddenAt = Date.now();
      if (v && !wasVisible && hiddenAt && Date.now() - hiddenAt > 4 * 60000 && memReady) { var g = greetBack(Date.now() - hiddenAt); speak(g[0], g[1]); }
      wasVisible = v;
    }).observe(document.documentElement);
  } catch (e) {}
  function daily() {
    var today = dayKey(), y = new Date(pbNow() - 86400000);
    if (mem.day === today) return;
    mem.streak = mem.day === dayKey(y) ? (mem.streak || 0) + 1 : 1; mem.days = (mem.days || 0) + 1; mem.day = today;
    var away = Date.now() - (mem.seen || Date.now());
    if (away > 3600000) mem.aff = clamp(mem.aff - Math.min(15, Math.floor(away / 3600000) * .5), 10, 100);  // slow fade while away
    addAff(2);
  }
  memLoad(function () {
    daily(); renderAff(); renderFocus();
    var g = greet(); speak(g[0], g[1]);
    mem.seen = Date.now(); memSave();
  });
  setInterval(function () { if (memReady && Date.now() - lastTouch < 600000) { mem.seen = Date.now(); memSave(); } }, 120000);
  setInterval(function () { if (live() && (focusLeft() > 0 || focusWas > 0)) renderFocus(); }, 1000);
  setInterval(function () { if (memReady) daily(); }, 600000);
  sched(tick, 16000, 24000);
  phonebox.on('state', function (s) { S = s; });
  phonebox.on('quotas', function (q) { Q = q; });
  phonebox.on('weather', function (w) { W = w; });
  phonebox.on('work', function (w) { var was = WORK && (WORK.sessions || []).some(function (x) { return x.status === 'waiting'; }); WORK = w;
    if (!was && memReady && (w.sessions || []).some(function (x) { return x.status === 'waiting'; }) && live()) speak('surprised', 'Claude закончил и ждёт тебя! Иди посмотри, бака!', { pose: 'point' }); });
  renderAff();
</script>
