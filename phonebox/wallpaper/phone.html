<!doctype html>
<html><head><meta charset="utf-8"><title>Tsuki wallpaper — phone</title>
<style>html, body { margin: 0; background: #000; } svg { display: block; width: 720px; height: 1640px; }
  text { font-family: "Yu Gothic UI", "Yu Gothic", Meiryo, "Noto Sans JP", sans-serif; }</style></head>
<body><div id="out"></div>
<script src="tsuki.js"></script>
<script>
  // 720 x 1640 lock screen: the top third stays calm for the clock, the moon sits behind it, Tsuki at the bottom.
  var T = TSUKI, W = 720, H = 1640, s = [];
  s.push('<svg xmlns="' + T.NS + '" viewBox="0 0 ' + W + ' ' + H + '" width="' + W + '" height="' + H + '">' + T.defs);
  s.push('<rect width="100%" height="100%" fill="#000"/>');
  s.push('<linearGradient id="fadeB" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#fff" stop-opacity=".6"/><stop offset=".55" stop-color="#fff" stop-opacity="0"/></linearGradient>' +
         '<mask id="mB"><rect width="100%" height="100%" fill="url(#fadeB)"/></mask><rect width="100%" height="100%" fill="url(#toneS)" mask="url(#mB)" opacity=".45"/>');
  s.push(T.focus(360, 1180, 330, 1300, 120, .07));
  s.push(T.moon(430, 520, 210, 'moon'));
  [[120, 260, 1.2], [600, 200, .9], [90, 760, .8], [650, 860, 1.3], [180, 980, .9], [560, 1040, .7], [330, 150, .7]]
    .forEach(function (p) { s.push(T.star(p[0], p[1], p[2], .9)); });
  s.push('<text x="22" y="1180" font-size="260" font-weight="900" fill="none" stroke="#fff" stroke-opacity=".09" stroke-width="2" writing-mode="tb" glyph-orientation-vertical="0">ツキ</text>');
  s.push('<g transform="translate(60 860) scale(3)">' + T.girl + '</g>');
  s.push('<g transform="translate(440 820)"><rect x="0" y="0" width="230" height="92" rx="30" fill="#000" stroke="#fff" stroke-width="3"/>' +
         '<path d="M40 88 L10 126 L72 90 Z" fill="#000" stroke="#fff" stroke-width="3" stroke-linejoin="round"/><rect x="36" y="84" width="40" height="8" fill="#000"/>' +
         '<text x="115" y="44" text-anchor="middle" font-size="34" fill="#fff" font-weight="700">…バカ。</text>' +
         '<text x="115" y="74" text-anchor="middle" font-size="19" fill="#9a9a9a">…бака.</text></g>');
  s.push(T.heart(640, 960, 1.3, false) + T.heart(612, 990, .8, true));
  s.push('<text x="46" y="900" font-size="74" font-weight="900" fill="#000" stroke="#fff" stroke-width="2.6" transform="rotate(-12 46 900)">ドキッ</text>');
  s.push('<rect x="18" y="18" width="' + (W - 36) + '" height="' + (H - 36) + '" fill="none" stroke="#fff" stroke-opacity=".2" stroke-width="2"/>');
  s.push('</svg>');
  document.getElementById('out').innerHTML = s.join('');
</script></body></html>
